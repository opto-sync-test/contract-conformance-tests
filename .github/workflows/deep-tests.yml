name: Deep test suite

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 9 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: ''
      - name: Compile
        run: python -m compileall -q src tests scripts
      - name: Verify repository contract
        run: python scripts/verify_repository.py
      - name: Run deterministic deep suite
        env:
          PYTHONPATH: src
          DEEP_TEST_SEEDS: '0-49'
        run: python -m unittest discover -s tests -v

  polyglot-envelope:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out conformance suite
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check out immutable opto-sync clients source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: opto-sync/opto-sync-clients
          ref: 98f76600ae402d38e5c812a7ec38d48f7b42000b
          path: .source/opto-sync-clients
          persist-credentials: false
          submodules: recursive
      - name: Check out immutable syncer.rs schema source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: opto-sync/syncer.rs
          ref: 8ef3d4bb63738a90b1e3958500578aebb89ee8cc
          path: .source/syncer-rs
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@12b7ff3796cabd9e0da05c556468eec2f565d246
        with:
          node-version: '24'
          cache: ''
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.88.0
      - name: Set up Dart
        uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1
        with:
          sdk: 3.12.1
      - name: Verify immutable merge-options schema provenance
        env:
          SYNCER_RS_DIR: ${{ github.workspace }}/.source/syncer-rs
        run: node scripts/verify_merge_options_source.mjs
      - name: Verify upstream Zed package and Ores dependency contract
        working-directory: .source/opto-sync-clients
        run: python scripts/check-zed-packaging.py
      - name: Validate upstream JSON Schema contracts
        working-directory: .source/opto-sync-clients/schema
        run: npm ci --ignore-scripts && npm test
      - name: Run canonical Rust, TypeScript, and Dart decision matrix
        env:
          OPTO_SYNC_CLIENTS_DIR: ${{ github.workspace }}/.source/opto-sync-clients
        run: node scripts/run_cross_language_matrix.mjs --prepare --require-telemetry
