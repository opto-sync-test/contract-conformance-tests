name: independent-validation-parity-v2

on:
  pull_request:
    paths:
      - "certification/**"
      - "scripts/certify-validation-parity.mjs"
      - ".github/workflows/independent-validation-parity-v2.yml"
  push:
    branches: [main]
    paths:
      - "certification/**"
      - "scripts/certify-validation-parity.mjs"
      - ".github/workflows/independent-validation-parity-v2.yml"
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * *"

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      producers: ${{ steps.matrix.outputs.producers }}
      api_docs_ref: ${{ steps.matrix.outputs.api_docs_ref }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - id: matrix
        shell: bash
        run: |
          node --input-type=module <<'MATRIX' >> "$GITHUB_OUTPUT"
          import { readFileSync } from "node:fs";
          const cohort = JSON.parse(readFileSync("certification/cohort.v2.json", "utf8"));
          const refs = cohort.producers.map(({ repository, ref, pullRequest }) => ({ repository, ref, pullRequest }));
          if (refs.length < 10) throw new Error(`expected at least 10 producers, got ${refs.length}`);
          if (refs.some(({ ref }) => !/^[0-9a-f]{40}$/.test(ref))) throw new Error("all producer refs must be immutable commits");
          console.log(`producers=${JSON.stringify({ include: refs })}`);
          console.log(`api_docs_ref=${cohort.apiDocsRef}`);
          MATRIX

  certify:
    needs: matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.producers) }}
    runs-on: ubuntu-latest
    name: certify ${{ matrix.repository }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.ref }}
          path: producer
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ORESoftware/api-docs
          ref: ${{ needs.matrix.outputs.api_docs_ref }}
          path: producer/.deps/api-docs
          persist-credentials: false
      - uses: actions/setup-node@1e60f620b9541dca151540016ba637bae5c2bf7a
        with:
          node-version: "22.16.0"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.25.x"
          cache: false
      - name: Reproduce both authorities and final outputs
        working-directory: producer
        run: node .deps/api-docs/tools/validation-parity/parity-tool.mjs --check
      - name: Certify receipt, every scope, route bindings, and privacy boundary
        run: node scripts/certify-validation-parity.mjs producer "${{ matrix.repository }}" "${{ matrix.ref }}"
      - name: Compile all TypeScript scopes and runtime facades
        shell: bash
        run: |
          mapfile -t files < <(find producer/generated/final/typescript -type f -name '*.ts' -print | sort)
          test "${#files[@]}" -gt 0
          npx --yes --package typescript@5.9.2 tsc -- --noEmit --strict --target ES2022 --module NodeNext --moduleResolution NodeNext "${files[@]}"
      - name: Compile every Rust scope
        shell: bash
        run: |
          found=0
          for file in producer/generated/final/rust/*/src/lib.rs; do
            test -f "$file" || continue
            found=1
            scope="$(basename "$(dirname "$(dirname "$file")")")"
            rustc --edition=2021 --crate-type=lib "$file" -o "/tmp/libvalidation_${scope}.rlib"
          done
          test "$found" -eq 1
      - name: Compile every Go scope
        shell: bash
        run: |
          tmp="$(mktemp -d)"
          printf 'module external-validation-cert\n\ngo 1.25.0\n' > "$tmp/go.mod"
          found=0
          for dir in producer/generated/final/golang/*; do
            test -f "$dir/types.go" || continue
            found=1
            scope="$(basename "$dir")"
            mkdir -p "$tmp/$scope"
            cp "$dir/types.go" "$tmp/$scope/types.go"
          done
          test "$found" -eq 1
          (cd "$tmp" && go test ./...)
      - name: Compile every Gleam scope
        shell: bash
        run: |
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/src"
          find producer/generated/final/gleam -type f -name '*.gleam' -exec cp {} "$tmp/src/" \;
          test -n "$(find "$tmp/src" -type f -name '*.gleam' -print -quit)"
          printf 'name = "external_validation_cert"\nversion = "0.1.0"\n\n[dependencies]\ngleam_stdlib = ">= 1.0.0 and < 2.0.0"\n' > "$tmp/gleam.toml"
          docker run --rm -v "$tmp:/work" -w /work ghcr.io/gleam-lang/gleam:v1.14.0-erlang-alpine sh -lc 'gleam check --target erlang'
