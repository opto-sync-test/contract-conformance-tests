name: Peer authority contract

on:
  pull_request:
    paths:
      - "contracts/sync-batch/**"
      - ".github/workflows/peer-authority-contract.yml"
  push:
    branches: [main]
    paths:
      - "contracts/sync-batch/**"
      - ".github/workflows/peer-authority-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tjsv-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact Opto Sync test head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact test revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Check out exact TJSV literal-union candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/typespec-json-schema-validator
          ref: d3124c2c5b25682b059ae05ff1a235cef7604876
          path: .tjsv
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact TJSV candidate revision
        run: test "$(git -C .tjsv rev-parse HEAD)" = "d3124c2c5b25682b059ae05ff1a235cef7604876"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.16.0

      - name: Install pinned TJSV dependency closure
        run: npm ci --prefix .tjsv

      - name: Transpile TypeSpec and compare generated vs authored JSON Schema
        run: |
          set -euo pipefail
          rm -rf .typespec-json-schema-validator/opto-sync
          mkdir -p .typespec-json-schema-validator/opto-sync/generated
          set +e
          node .tjsv/bin/typespec-json-schema-validator.mjs check \
            --typespec contracts/sync-batch/main.tsp \
            --schema contracts/sync-batch/authored.schema.json \
            --instances contracts/sync-batch/instances \
            --output-dir .typespec-json-schema-validator/opto-sync/generated \
            --bundle-id typespec.generated.schema.json \
            --report .typespec-json-schema-validator/opto-sync/report.json \
            --sarif .typespec-json-schema-validator/opto-sync/report.sarif \
            --contract-ir .typespec-json-schema-validator/opto-sync/contract-ir.json \
            --quiet
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "TJSV stopped with exit $status; parity report follows" >&2
            test -s .typespec-json-schema-validator/opto-sync/report.json && cat .typespec-json-schema-validator/opto-sync/report.json >&2
            exit "$status"
          fi
          test -s .typespec-json-schema-validator/opto-sync/generated/typespec.generated.schema.json
          test -s .typespec-json-schema-validator/opto-sync/report.json
          test -s .typespec-json-schema-validator/opto-sync/contract-ir.json
          grep -F '"$schema": "https://json-schema.org/draft/2020-12/schema"' \
            contracts/sync-batch/authored.schema.json
