name: Opto Sync policy peer-authority convergence

on:
  pull_request:
    paths:
      - 'contracts/sync-policy/**'
      - '.github/workflows/sync-policy-peer-authority.yml'
  push:
    branches: [main]
    paths:
      - 'contracts/sync-policy/**'
      - '.github/workflows/sync-policy-peer-authority.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  peer-authority:
    uses: flags-2-env-test/contract-conformance-tests/.github/workflows/peer-authority-convergence.yml@7756eb9b08ec4909c4acb8ed3cef59f4280028bd
    with:
      typespec_path: contracts/sync-policy/main.tsp
      schema_path: contracts/sync-policy/authored.schema.json
      instances_path: contracts/sync-policy/instances
      expected_declarations_json: '["OptoSyncPolicy.SyncPolicyV1"]'
