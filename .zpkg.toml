[package]
org = "opto-sync-test"
name = "contract-conformance-tests"
version = "0.2.0"
description = "Executable Rust, TypeScript, and Dart conformance for opto-sync contracts"
license = "MIT"

[package.repository]
vcs = "git"
url = "https://github.com/opto-sync-test/contract-conformance-tests"

[install]
dir = ".vendor/.zed"

[develop]
commands = [
  "PYTHONPATH=src python -m unittest discover -s tests -v",
  "node --test tests/temporary_rust_workspace.test.mjs",
  "python scripts/verify_repository.py",
  "node scripts/run_cross_language_matrix.mjs --prepare --require-telemetry"
]
