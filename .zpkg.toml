[package]
org = "opto-sync-test"
name = "contract-conformance-tests"
version = "0.2.0"
description = "Executable Rust, TypeScript, and Dart conformance for opto-sync contracts"
license = "MIT"
language = "python"

[package.repository]
vcs = "git"
url = "https://github.com/opto-sync-test/contract-conformance-tests"

[publish]
include_readme = true
tag_format = "v{version}"
exclude = [".env", ".env.*", ".venv/**", ".vendor/**", "vendor/**", "artifacts/**", "**/__pycache__/**", "**/*.pyc", ".pytest_cache/**"]

[install]
dir = ".vendor/.zed"
adapter = "none"

[scripts]
test = "PYTHONPATH=src python -m unittest discover -s tests -v && node --test tests/temporary_rust_workspace.test.mjs && python scripts/verify_repository.py && node scripts/run_cross_language_matrix.mjs --prepare --require-telemetry"
